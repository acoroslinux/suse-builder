---
dontChroot: false
timeout: 3600
script:
    - "-dracut -f --no-hostonly"
    - "sh -c 'if [ -f /etc/locale.conf ]; then . /etc/locale.conf; if [ -n \"$LANG\" ] && [ -f /etc/sysconfig/language ]; then sed -i \"s/^RC_LANG=.*/RC_LANG=\\\"$LANG\\\"/\" /etc/sysconfig/language; fi; fi'"
    - "sh -c 'rm -f /etc/skel/Desktop/install*.desktop /etc/skel/Desktop/calamares*.desktop /home/*/Desktop/install*.desktop /home/*/Desktop/calamares*.desktop /usr/share/applications/install-suse.desktop /etc/xdg/autostart/create-install-icon.desktop'"
i18n:
    name: "Rebuilding initramfs and finalizing system settings..."
